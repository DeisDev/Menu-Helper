[General]
; What happens when mod entries would make the main or pause menu longer than it can show.
; auto: move all mod entries into one MODS entry, only when needed.
; always: always use the MODS entry.
; never: keep mod entries in the list, which then scrolls.
sModsFolder = auto

[Translations]
; 1: write every text each mod shows to
; Data/Interface/MenuHelper/Translations/<mod>_template.json, ready to translate.
bExportTemplates = 0
